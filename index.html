<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11131a"><title>ひみつギャラリー</title><style>
:root{color-scheme:dark;--bg:#101117;--panel:#1b1e29;--line:#303444;--muted:#a7adbf;--accent:#b8c5ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f5f6fc;font-family:system-ui,-apple-system,sans-serif}header{position:sticky;top:0;background:#101117ed;backdrop-filter:blur(12px);z-index:3;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}h1{font-size:19px;margin:0}button,.btn{border:1px solid var(--line);background:var(--panel);color:#fff;padding:10px 13px;border-radius:12px;font:inherit;cursor:pointer}button.primary,.primary{background:var(--accent);color:#11131a;border-color:var(--accent);font-weight:700}main{max-width:760px;margin:auto;padding:14px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.toolbar label{display:inline-block}.folders{display:flex;gap:8px;overflow-x:auto;padding:14px 0}.folder{white-space:nowrap}.folder.active{background:var(--accent);color:#11131a;border-color:var(--accent)}.hint{font-size:12px;color:var(--muted);line-height:1.7}.item{margin:0 0 16px;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}.item img,.item video{display:block;width:100%;max-height:75vh;object-fit:contain;background:#08090c}.meta{display:flex;align-items:center;gap:8px;padding:10px 12px;font-size:12px;color:var(--muted)}.meta .name{flex:1;overflow-wrap:anywhere}.empty{text-align:center;padding:45px 15px;border:1px dashed var(--line);border-radius:16px;color:var(--muted);line-height:1.8}.screen{position:fixed;inset:0;z-index:10;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:22px}.box{width:100%;max-width:390px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:24px}.box h2{margin-top:0}.box p{font-size:13px;line-height:1.7;color:var(--muted)}input{max-width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#101117;color:white;font:inherit}input[type=password]{width:100%;font-size:18px;letter-spacing:4px;margin:10px 0}.hidden{display:none!important}.danger{color:#ffb5b5}footer{padding:24px 8px;text-align:center;color:var(--muted);font-size:11px}
</style><meta name="theme-color" content="#101117"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"></head><body><div id="lock" class="screen"><div class="box"><h2>🔒 ひみつギャラリー</h2><p id="intro">暗証番号を設定してください。保存したファイルは暗号化してこのブラウザ内に保存します。</p><form id="pinForm"><input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" minlength="6" maxlength="12" placeholder="6〜12桁の数字" autocomplete="off" required><button class="primary" style="width:100%" id="unlockBtn">設定して開く</button></form><p id="err" class="danger"></p><p>暗証番号を忘れるとデータを復元できません。</p></div></div><header><h1>🔐 ひみつギャラリー</h1><button id="lockBtn">ロック</button></header><main><div class="toolbar"><button class="primary" id="createFolder">＋ ファイルを作成</button><label class="btn primary" for="picker">＋ 画像・動画を追加</label><input id="picker" type="file" accept="image/*,video/*" multiple hidden><button id="newest">新しい順</button><button id="oldest">古い順</button></div><div id="folders" class="folders"></div><p class="hint">「思い出」「猫」など好きな名前のファイル（フォルダ）を作成し、選択中のフォルダに画像・動画を取り込みます。取り込んだコピーは元ファイルとは別に保存されます。</p><section id="feed"></section><footer>ブラウザ内に保存されます。ブラウザのデータ消去・容量制限などにより失われる可能性があります。大切なデータは別途バックアップしてください。</footer></main><script>
(()=>{'use strict';const DB='secret-gallery-db-v2',STORE='media',META='meta';let db,key,order='newest',selected='すべて',busy=false;const $=id=>document.getElementById(id),lock=$('lock'),pin=$('pin'),err=$('err'),feed=$('feed');function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{r.result.createObjectStore(STORE,{keyPath:'id',autoIncrement:true});r.result.createObjectStore(META,{keyPath:'key'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}function req(r){return new Promise((a,b)=>{r.onsuccess=()=>a(r.result);r.onerror=()=>b(r.error)})}function tx(s,m='readonly'){return db.transaction(s,m).objectStore(s)}async function derive(p,s){let b=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:s,iterations:250000,hash:'SHA-256'},b,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}async function encrypt(data,k){let iv=crypto.getRandomValues(new Uint8Array(12));return {iv:[...iv],data:await crypto.subtle.encrypt({name:'AES-GCM',iv},k,data)}}async function decrypt(x,k){return crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array(x.iv)},k,x.data)}async function auth(p){let m=await req(tx(META).get('auth'));if(!m){let salt=crypto.getRandomValues(new Uint8Array(16)),k=await derive(p,salt),check=await encrypt(new TextEncoder().encode('gallery-ok'),k);await req(tx(META,'readwrite').put({key:'auth',salt:[...salt],check}));key=k;return true}try{let k=await derive(p,new Uint8Array(m.salt)),v=await decrypt(m.check,k);if(new TextDecoder().decode(v)!=='gallery-ok')return false;key=k;return true}catch{return false}}async function all(){return req(tx(STORE).getAll())}async function folderNames(){let a=await all(),m=await req(tx(META).getAll()),saved=m.filter(x=>typeof x.key==='string'&&x.key.startsWith('folder:')).map(x=>x.name);return ['すべて',...new Set([...saved,...a.map(x=>x.folder||'未分類')])]}async function renderFolders(){let names=await folderNames();if(!names.includes(selected))selected='すべて';let el=$('folders');el.replaceChildren();for(let n of names){let b=document.createElement('button');b.className='folder'+(n===selected?' active':'');b.textContent=n;b.onclick=()=>{selected=n;render()};el.append(b)}if(selected!=='すべて'){let rename=document.createElement('button');rename.textContent='名前変更';rename.onclick=async()=>{let next=prompt('新しいフォルダ名',selected);if(!next||!next.trim()||next.trim()===selected)return;let a=await all();for(let x of a)if((x.folder||'未分類')===selected){x.folder=next.trim();await req(tx(STORE,'readwrite').put(x))}await req(tx(META,'readwrite').put({key:'folder:'+next.trim(),name:next.trim()}));await req(tx(META,'readwrite').delete('folder:'+selected));selected=next.trim();render()};el.append(rename);let del=document.createElement('button');del.textContent='フォルダ削除';del.onclick=async()=>{if(!confirm('フォルダ内のファイルもすべて削除します。よろしいですか？'))return;let a=await all();for(let x of a)if((x.folder||'未分類')===selected)await req(tx(STORE,'readwrite').delete(x.id));await req(tx(META,'readwrite').delete('folder:'+selected));selected='すべて';render()};el.append(del)}}async function render(){await renderFolders();feed.replaceChildren();let items=await all();if(selected!=='すべて')items=items.filter(x=>(x.folder||'未分類')===selected);items.sort((a,b)=>order==='newest'?b.added-a.added:a.added-b.added);if(!items.length){let d=document.createElement('div');d.className='empty';d.textContent=selected==='すべて'?'まだファイルがありません。「ファイルを作成」してから画像・動画を追加してください。':'このフォルダは空です。画像・動画を追加してください。';feed.append(d);return}for(let item of items){try{let raw=await decrypt(item.payload,key),url=URL.createObjectURL(new Blob([raw],{type:item.type})),card=document.createElement('article');card.className='item';let media;if(item.type.startsWith('video/')){media=document.createElement('video');media.controls=true;media.playsInline=true;media.preload='metadata'}else{media=document.createElement('img');media.alt=item.name;media.loading='lazy'}media.src=url;let bar=document.createElement('div');bar.className='meta';let name=document.createElement('span');name.className='name';name.textContent='📁 '+(item.folder||'未分類')+' · '+item.name;let del=document.createElement('button');del.textContent='削除';del.onclick=async()=>{if(confirm('このアプリ内のコピーを削除しますか？')){await req(tx(STORE,'readwrite').delete(item.id));URL.revokeObjectURL(url);render()}};bar.append(name,del);card.append(media,bar);feed.append(card)}catch(e){}}} $('createFolder').onclick=async()=>{let n=prompt('作成するファイル（フォルダ）の名前\n例：思い出、猫');if(!n||!n.trim())return;n=n.trim();let names=await folderNames();if(names.includes(n)){alert('同じ名前がすでにあります。');return}await req(tx(META,'readwrite').put({key:'folder:'+n,name:n}));selected=n;await renderFolders();feed.innerHTML='<div class="empty">「'+n.replaceAll('&','&amp;').replaceAll('<','&lt;')+'」を作成しました。画像・動画を追加してください。</div>'};$('picker').onchange=async e=>{let files=[...e.target.files];e.target.value='';if(!files.length||!key)return;let folder=selected==='すべて'?prompt('保存先の名前（例：思い出、猫）','思い出'):selected;if(!folder||!folder.trim())return;folder=folder.trim();let label=document.querySelector('label[for=picker]');label.textContent='保存中…';try{for(let f of files){if(!f.type.startsWith('image/')&&!f.type.startsWith('video/'))continue;let payload=await encrypt(await f.arrayBuffer(),key);await req(tx(STORE,'readwrite').put({name:f.name,type:f.type||'application/octet-stream',size:f.size,added:Date.now(),folder,payload}))}selected=folder;await render()}catch(e){alert('保存できませんでした。端末の空き容量を確認してください。')}finally{label.textContent='＋ 画像・動画を追加'}};$('newest').onclick=()=>{order='newest';render()};$('oldest').onclick=()=>{order='oldest';render()};function doLock(){key=null;feed.replaceChildren();lock.classList.remove('hidden');$('intro').textContent='暗証番号を入力してください。';$('unlockBtn').textContent='ロック解除';pin.value='';err.textContent=''}$('lockBtn').onclick=doLock;$('pinForm').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;try{let ok=await auth(pin.value);if(!ok){err.textContent='暗証番号が違います。';return}lock.classList.add('hidden');pin.value='';await render()}catch(e){err.textContent='保存領域を開けません。Chromeで開いてください。'}finally{busy=false}};document.addEventListener('visibilitychange',()=>{if(document.hidden&&key)doLock()});if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}(async()=>{try{db=await openDB();let m=await req(tx(META).get('auth'));if(m){$('intro').textContent='暗証番号を入力してください。';$('unlockBtn').textContent='ロック解除'}}catch(e){err.textContent='この環境では保存機能を利用できません。'}})()})();
</script></body></html>
